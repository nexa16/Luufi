name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    # PRs verify the integrated source graph before develop can merge.
    # Avoid running the same coverage gate again for its merge commit.
    # Production still needs evidence on its exact promoted main head.
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned hosted runner already supplies Chromium system libraries.
      # Install the matching browser without unrelated apt upgrades/font packs.
      - run: pnpm exec playwright install chromium
      - name: Local isolated browser identity
        shell: bash
        run: |
          printf '%s\n' 'LUUFI_ENVIRONMENT=local' 'LUUFI_SOURCE_BRANCH=local' 'LUUFI_COMMIT_SHA=0000000000000000000000000000000000000000' 'LUUFI_LOCAL_TEST_MODE=1' > .dev.vars
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-diagnostics
          path: |
            playwright-report
            test-results
            coverage
