name: Merge verified development changes
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # This privileged workflow never checks out or executes pull request code.
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/ci.yml' || run.head_repository?.id !== context.payload.repository.id) return;
            const {data: pulls} = await github.rest.pulls.list({...context.repo, state:'open', base:'develop', head:`${context.repo.owner}:${run.head_branch}`});
            const matching = pulls.filter(pr => !pr.draft && pr.head.repo?.id === context.payload.repository.id && pr.head.sha === run.head_sha && pr.base.ref === 'develop');
            if (matching.length !== 1) return;
            const pr = matching[0];
            const {data: latest} = await github.rest.pulls.get({...context.repo, pull_number:pr.number});
            if (latest.head.sha !== run.head_sha || latest.base.ref !== 'develop' || latest.state !== 'open' || latest.draft) return;
            await github.rest.pulls.merge({...context.repo,pull_number:pr.number,sha:run.head_sha,merge_method:'merge'});
