# The test pool has its own newer Wrangler/type peer scope. Keep the Vinext
# Cloudflare plugin on its proven Wrangler API instead of hoisting that CLI.
packageExtensions:
  '@cloudflare/vitest-plugin@1.1.7':
    dependencies:
      '@cloudflare/workers-types': '5.20260910.1'
allowBuilds:
  'esbuild@0.27.3 || 0.28.1': true
  'workerd@1.20260515.1 || 1.20260910.1': true
  'sharp@0.34.5': true
